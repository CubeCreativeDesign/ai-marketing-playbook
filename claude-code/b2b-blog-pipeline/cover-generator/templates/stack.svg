<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Layout "stack". Color tokens come from theme.json. Text slots live in layouts.json. -->
  <rect x="0" y="0" width="1920" height="1080" fill="{{accent}}"/>
  <rect x="48" y="48" width="1824" height="984" fill="none" stroke="{{accent2}}" stroke-width="10"/>
  <g opacity="0.08" fill="{{paper}}">
    <circle cx="0" cy="1080" r="420"/>
    <circle cx="1920" cy="0" r="360"/>
  </g>
  <!-- Optional: add your logo here, for example <image href="logo.png" x="810" y="960" width="300" height="56"/> -->
</svg>
